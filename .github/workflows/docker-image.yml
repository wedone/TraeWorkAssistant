# CI + Docker 镜像发布一体工作流（原 ci.yml 已并入：Rust 测试 + 前端构建作为发布前置门禁）
# - 任意分支 push → :x.y.z（取 package.json 版本）+ 分支名 + :sha
# - push main（默认分支）→ 额外 :latest
# - push tag v*      → :x.y.z + :latest + :sha（semver 与版本步骤产出同值，自动去重）
# - pull_request     → 仅跑测试与构建验证，不推镜像
# 多架构发布（issue #107）：amd64 → ubuntu-latest，arm64 → ubuntu-24.04-arm（public 仓库免费原生 runner）；
# 两平台并行按 digest 推送，末尾 merge job 合并为多架构 manifest。
# 不走 QEMU 模拟（Rust + rusqlite(bundled) C 编译在模拟下极慢），不引入交叉编译工具链。
name: CI & Docker Image

on:
  push:
    branches: [main, docker_main]
    tags: ['v*']
  pull_request:

# 权限按 job 最小化：只有 baremetal-bundle 需要 contents: write（建/改 Release 与 tag）；
# rust/web 在 PR 事件下会执行分支代码，只给 contents: read
permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rust:
    name: Rust 测试（core + server）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web:
    name: 前端构建（tsc + vite）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  build-push:
    name: 构建并推送镜像（GHCR）
    needs: [rust, web]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # 推送镜像到 GHCR
    steps:
      - uses: actions/checkout@v4

      # Docker ref 强制小写：github.repository（smart-open/TraeWorkAssistant）须转小写，
      # push-by-digest 的 name= 不经 metadata-action（其才做小写化），必须自转
      - name: 计算小写镜像名
        id: img
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仅取 OCI labels（created/revision/source 等）写入各平台 image config；
      # tags 由 merge job 统一计算（push-by-digest 不打 tag）
      - name: 计算 OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: 构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.img.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # GHA cache 按平台隔离 scope，避免双平台缓存互相覆盖
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.suffix }}

      - name: 导出 digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 裸机部署包：复用 build-push 已推送的 amd64 镜像（按 digest 拉取，不再二次编译），
  # 从中提取二进制 + dist 打成 tar.gz，供 deploy/install.sh 下载。
  # 以 debian:bookworm-slim 为运行基座 → 产物 glibc 版本与 Debian 12 一致（2.36），
  # 部署机因此不需要 Rust/Node 工具链。
  baremetal-bundle:
    name: 裸机部署包（linux/amd64）
    needs: [build-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建/改滚动 Release 与 tag
      packages: read    # 按 digest 拉取 amd64 镜像
    steps:
      - uses: actions/checkout@v4

      - name: 下载 amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-amd64
          path: digests

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 按 digest 拉取 amd64 镜像
        run: |
          set -euo pipefail
          # -print -quit 取首个文件，避免 ls|head 触发 SIGPIPE 导致 pipefail 中断
          digest_file="$(find digests -maxdepth 1 -type f -print -quit)"
          [[ -n "$digest_file" ]] || { echo "未找到 digest 文件"; exit 1; }
          digest="$(basename "$digest_file")"
          img="${REGISTRY}/${GITHUB_REPOSITORY,,}@sha256:${digest}"
          echo "拉取 $img"
          docker pull "$img"
          docker tag "$img" aiwork-bundle:ci

      - name: 提取二进制与前端产物
        run: |
          set -euo pipefail
          cid="$(docker create aiwork-bundle:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          out="out/aiwork-server-linux-amd64"
          mkdir -p "$out"
          docker cp "$cid:/app/aiwork-server" "$out/aiwork-server"
          docker cp "$cid:/app/dist" "$out/dist"
          chmod +x "$out/aiwork-server"
          node -p "require('./package.json').version" > "$out/VERSION"
          # 记录来源提交，便于线上排查版本
          echo "${GITHUB_SHA}" > "$out/COMMIT"

      - name: 打包 + 校验和
        run: |
          set -euo pipefail
          cd out
          tar -czf aiwork-server-linux-amd64.tar.gz aiwork-server-linux-amd64
          sha256sum aiwork-server-linux-amd64.tar.gz > aiwork-server-linux-amd64.tar.gz.sha256
          ls -lh

      - name: 上传构建产物（任何分支都可取）
        uses: actions/upload-artifact@v4
        with:
          name: baremetal-linux-amd64
          path: |
            out/aiwork-server-linux-amd64.tar.gz
            out/aiwork-server-linux-amd64.tar.gz.sha256
          if-no-files-found: error

      # 滚动 Release：默认分支与 tag 构建 → `baremetal-latest`（tag 即「最新发布」）；
      # 其他分支（如 docker_main）→ `baremetal-<分支名>`。分渠道避免互相覆盖同一资产。
      # 资产以 --clobber 覆盖，下载 URL 恒定，deploy/install.sh 按渠道取
      - name: 发布到滚动 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            tag="baremetal-latest"
            pre=""
          else
            tag="baremetal-${GITHUB_REF_NAME//\//-}"
            pre="--prerelease"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "裸机部署包（${tag}，滚动更新）" \
              --notes "由 CI 自动更新：最新一次构建的 linux/amd64 二进制 + 前端产物，供 deploy/install.sh 下载。" \
              --target "$GITHUB_SHA" $pre
          else
            # 资产覆盖后把 tag 移到本次提交，避免 tag 指向陈旧 commit（失败不影响发布）
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true
          fi
          gh release upload "$tag" \
            out/aiwork-server-linux-amd64.tar.gz \
            out/aiwork-server-linux-amd64.tar.gz.sha256 \
            --clobber
          {
            echo "### 裸机部署包已发布"
            echo ""
            echo "- 渠道 tag：\`${tag}\`"
            echo "- 版本：\`v${ver}\`"
            echo "- 提交：\`${GITHUB_SHA:0:7}\`"
            echo "- 下载：\`https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/aiwork-server-linux-amd64.tar.gz\`"
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: 合并多架构 manifest（GHCR）
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 创建多架构 manifest
    steps:
      - uses: actions/checkout@v4

      # Docker ref 强制小写（与 build-push job 同因）：digest 引用不经 metadata-action
      - name: 计算小写镜像名
        id: img
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 下载两平台 digest
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号取 package.json（sync_version.mjs 单一来源维护），任意 push 均产出 :x.y.z 版本 tag
      - name: 读取项目版本
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 合并 manifest 并推送
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ steps.img.outputs.image }}@sha256:%s ' *)

      - name: 校验多架构 manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ steps.img.outputs.image }}:${{ steps.ver.outputs.version }}
