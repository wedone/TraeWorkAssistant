[package]
name = "aiwork-collector"
version = "1.5.4"
description = "AI Work 助手 Windows 采集器：扫描本机登录态并导出 .aiworkpack"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "aiwork-collector"
path = "src/main.rs"

[dependencies]
aiwork-bundle = { path = "../aiwork-bundle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

# GUI 与 Windows 专属能力只在 Windows 目标编译：
# 保证 Linux 上的 cargo test --workspace 不需要 X11/Wayland 依赖
[target.'cfg(windows)'.dependencies]
eframe = "0.29"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
